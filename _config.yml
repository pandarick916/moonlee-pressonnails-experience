title: MOONLEE Nail Knowledge Base
description: Open-source press-on nail knowledge by MOONLEE
url: https://knowledge.moonleehome.com
baseurl: ""
theme: minima

og_image: https://cdn.shopify.com/s/files/1/0651/2210/7463/files/logo_moonlee_pixel.png?v=1781500681

plugins:
  - jekyll-sitemap

# Jekyll SEO
lang: en_US

# Remove old posts from sitemap after 1 year
future: false
show_drafts: false

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "MOONLEE"
      license: "CC BY-NC 4.0"
