<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/assets/main.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lato:400,400i,700">

{% unless page.layout == "post" %}
<link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">
{% endunless %}

<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:image" content="{% if page.image %}{{ page.image }}{% else %}{{ site.og_image | absolute_url }}{% endif %}">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.title | default: site.title }}">
<meta name="twitter:image" content="{% if page.image %}{{ page.image }}{% else %}{{ site.og_image | absolute_url }}{% endif %}">
